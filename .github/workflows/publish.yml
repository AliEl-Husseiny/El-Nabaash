name: Deploy El-Nabaash to MonsterASP.NET

on:
  push:
    branches:
      - main 

jobs:
  build_and_deploy:
    runs-on: windows-latest
    env:
      DEPLOY_WEBSITE_NAME: ${{ secrets.WEBSITE_NAME || vars.WEBSITE_NAME }}
      DEPLOY_SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME || vars.SERVER_COMPUTER_NAME }}
      DEPLOY_SERVER_USERNAME: ${{ secrets.SERVER_USERNAME || vars.SERVER_USERNAME }}
      DEPLOY_SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Inject Database Connection String
        uses: microsoft/variable-substitution@v1
        with:
          files: '**/appsettings.json'
        env:
          ConnectionStrings.DbConnection: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish

      - name: Validate deployment configuration
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace("${{ env.DEPLOY_WEBSITE_NAME }}")) { $missing += "WEBSITE_NAME (secret or variable)" }
          if ([string]::IsNullOrWhiteSpace("${{ env.DEPLOY_SERVER_COMPUTER_NAME }}")) { $missing += "SERVER_COMPUTER_NAME (secret or variable)" }
          if ([string]::IsNullOrWhiteSpace("${{ env.DEPLOY_SERVER_USERNAME }}")) { $missing += "SERVER_USERNAME (secret or variable)" }
          if ([string]::IsNullOrWhiteSpace("${{ env.DEPLOY_SERVER_PASSWORD }}")) { $missing += "SERVER_PASSWORD (secret)" }
          if ($missing.Count -gt 0) {
            Write-Error ("Missing deployment configuration: " + ($missing -join ", "))
            exit 1
          }

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ env.DEPLOY_WEBSITE_NAME }}
          server-computer-name: ${{ env.DEPLOY_SERVER_COMPUTER_NAME }}
          server-username: ${{ env.DEPLOY_SERVER_USERNAME }}
          server-password: ${{ env.DEPLOY_SERVER_PASSWORD }}