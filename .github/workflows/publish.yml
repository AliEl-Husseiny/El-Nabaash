name: Deploy El-Nabaash to MonsterASP.NET

on:
  push:
    branches:
      - main 

jobs:
  build_and_deploy:
    runs-on: windows-latest
    env:
      DEPLOY_WEBSITE_NAME: ${{ secrets.WEBSITE_NAME || vars.WEBSITE_NAME }}
      DEPLOY_SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME || vars.SERVER_COMPUTER_NAME }}
      DEPLOY_SERVER_USERNAME: ${{ secrets.SERVER_USERNAME || vars.SERVER_USERNAME }}
      DEPLOY_SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Inject Database Connection String
        uses: microsoft/variable-substitution@v1
        with:
          files: '**/appsettings.json'
        env:
          ConnectionStrings.DbConnection: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish
